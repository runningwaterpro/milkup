name: Release

on:
  push:
    tags:
      - "v*"
  # 手动运行只构建并上传 workflow artifact，不创建 GitHub Release。
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm rebuild

      - name: Verify version matches tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "v$($pkg.version)"
          $actual = "${{ github.ref_name }}"
          if ($expected -ne $actual) {
            throw "package.json version $($pkg.version) does not match tag $actual"
          }

      - name: Build renderer and main process
        run: |
          pnpm run generate-icons
          pnpm run build

      - name: Build NSIS installer
        run: >
          pnpm exec electron-builder
          --win nsis
          --x64
          --publish=never
          --config.directories.output=release/nsis

      - name: Build portable executable
        run: >
          pnpm exec electron-builder
          --win portable
          --x64
          --publish=never
          --config.directories.output=release/portable

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $nsisDir = "release/nsis"
          $portableDir = "release/portable"

          $setup = Get-ChildItem "$nsisDir/*.exe" |
            Where-Object { $_.Name -match "Setup" } |
            Select-Object -First 1
          if (-not $setup) {
            throw "NSIS Setup executable not found in $nsisDir"
          }

          $portable = Get-ChildItem "$portableDir/*.exe" |
            Where-Object { $_.Name -match "Portable" } |
            Select-Object -First 1
          if (-not $portable) {
            throw "Portable executable not found in $portableDir"
          }

          $blockmap = "$($setup.FullName).blockmap"
          if (-not (Test-Path $blockmap)) {
            throw "NSIS blockmap not found: $blockmap"
          }

          $exe = Join-Path $nsisDir "win-unpacked/milkup.exe"
          if (-not (Test-Path $exe)) {
            throw "Unpacked milkup.exe not found: $exe"
          }
          $vi = (Get-Item $exe).VersionInfo
          if ($vi.ProductName -ne "milkup") {
            throw "ProductName is '$($vi.ProductName)', expected 'milkup'"
          }
          if ($vi.OriginalFilename -match "electron") {
            throw "OriginalFilename still points to electron.exe"
          }

          $updateYml = Join-Path $nsisDir "win-unpacked/resources/app-update.yml"
          if (-not (Test-Path $updateYml)) {
            throw "app-update.yml not found: $updateYml"
          }
          $updateText = Get-Content $updateYml -Raw
          if ($updateText -notmatch "owner:\s*runningwaterpro") {
            throw "app-update.yml owner is not runningwaterpro"
          }
          if ($updateText -notmatch "repo:\s*milkup") {
            throw "app-update.yml repo is not milkup"
          }

          $icon = Join-Path $nsisDir "win-unpacked/resources/assets/icons/milkup.ico"
          if (-not (Test-Path $icon)) {
            throw "Packaged app icon not found: $icon"
          }

          $latest = Join-Path $nsisDir "latest.yml"
          if (-not (Test-Path $latest)) {
            throw "latest.yml not found: $latest"
          }
          $latestText = Get-Content $latest -Raw
          if ($latestText -notmatch [regex]::Escape($setup.Name)) {
            throw "latest.yml does not reference $($setup.Name)"
          }
          if ($latestText -match "Portable") {
            throw "latest.yml references a Portable artifact"
          }

          if (Select-String -Path "package.json" -Pattern "auto-plugin/milkup" -Quiet) {
            throw "package.json still points to the upstream repository"
          }
          if (Select-String -Path "src/main/update.ts" -Pattern "auto-plugin/milkup" -Quiet) {
            throw "src/main/update.ts still points to the upstream repository"
          }

          Write-Host "Setup: $($setup.Name)"
          Write-Host "Portable: $($portable.Name)"
          Write-Host "ProductName: $($vi.ProductName)"
          Write-Host "OriginalFilename: '$($vi.OriginalFilename)'"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: milkup-windows
          path: |
            release/nsis/*.exe
            release/nsis/*.exe.blockmap
            release/nsis/latest.yml
            release/portable/*.exe
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: build-windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: milkup-windows
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name "*.exe" -o -name "*.exe.blockmap" -o -name "latest.yml" \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Milkup $TAG"
          fi
